const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pw=document.getElementById('pw'),go=document.getElementById('go'),m=document.getElementById('m');
let busy=false;
async function unlock(){
 if(busy)return;
 if(!(window.crypto&&crypto.subtle)){m.textContent='Este navegador no permite descifrar la página.';return;}
 busy=true;go.disabled=true;m.textContent='Verificando…';let html;
 try{
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct)));
 }catch(e){busy=false;go.disabled=false;m.textContent='Clave incorrecta.';pw.select();return;}
 document.open();document.write(html);document.close();
}
go.addEventListener('click',unlock);pw.addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script></body></html>
