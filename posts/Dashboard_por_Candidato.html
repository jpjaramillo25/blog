</script></head><body><style>
.lx{position:relative;max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:var(--cds-gap-lg);font-family:var(--font-anthropic-sans);color:var(--color-fg);font-size:var(--cds-font-size-body);line-height:1.45}
.lx *{box-sizing:border-box}
.lx-title{font-family:var(--font-anthropic-serif);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.1;margin:0;text-wrap:balance}
.lx-sub{margin:.4rem 0 0;color:var(--color-fg-muted);max-width:60ch}
.lx-card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);min-width:0}
.lx-h{font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:0 0 .15rem;text-wrap:balance}
.lx-note{margin:0 0 var(--cds-gap-md);color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);max-width:75ch}
.lx-sec{margin:var(--cds-gap-md) 0 0;font-family:var(--font-anthropic-serif);font-weight:400;font-size:var(--cds-font-size-title);text-wrap:balance}
.lx-sec-note{margin:.2rem 0 0;color:var(--color-fg-muted);max-width:70ch}
.lx-grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:var(--cds-gap-md)}
.lx-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:var(--cds-gap-md)}
.lx-step{border-top:2px solid var(--color-fg);padding-top:.5rem}
.lx-step b{display:block;font-weight:600;margin-bottom:.15rem}
.lx-step span{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.lx-tip{position:absolute;z-index:5;pointer-events:none;background:var(--cds-surface-popover);border:1px solid var(--cds-border);border-radius:var(--cds-radius);box-shadow:var(--cds-shadow-popover);padding:var(--cds-pad-xs) var(--cds-pad-sm);font-size:var(--cds-font-size-caption);max-width:19rem}
.lx-tip-t{color:var(--cds-text-secondary);margin-bottom:.15rem}
.lx svg{display:block;max-width:100%;overflow:visible}
.lx svg text{font-family:var(--font-anthropic-sans);font-size:12px;fill:var(--color-fg-muted)}
.lx svg text.lx-st{fill:var(--color-fg)}
.lx svg text.lx-gh{fill:var(--color-fg);font-weight:600;font-size:12px}
/* barras de intención */
.lx-brow{display:grid;grid-template-columns:minmax(7.5rem,11rem) 1fr 4.2rem;align-items:center;gap:.6rem;padding:.2rem 0}
.lx-blab{font-size:var(--cds-font-size-caption)}
.lx-blab i{font-style:normal;margin-left:.4rem;border:1px solid var(--color-border-line);border-radius:999px;padding:0 .35rem;color:var(--color-fg-muted);font-size:.68rem}
.lx-btrack{height:20px}
.lx-bar{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.lx-bval{text-align:right;font-variant-numeric:tabular-nums}
/* referencias */
.lx-refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:var(--cds-gap-md)}
.lx-ref{border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-sm) var(--cds-pad-md);min-width:0}
.lx-ref h4{margin:0;font-size:var(--cds-font-size-body);font-weight:600}
.lx-ref .vs{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);margin:.1rem 0 .5rem}
.lx-ref .vs b{color:var(--color-fg)}
.lx-ref .tag{float:right;font-size:.68rem;color:var(--color-fg-muted);border:1px solid var(--color-border-line);border-radius:999px;padding:0 .4rem;margin-left:.4rem}
.lx-stack{display:flex;gap:2px;height:16px}
.lx-stack span{display:block;border-radius:3px;min-width:3px}
.lx-leg{display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin-top:.5rem;font-size:var(--cds-font-size-caption)}
.lx-leg span{display:inline-flex;align-items:center;gap:.35rem}
.lx-leg i{width:.7rem;height:.7rem;border-radius:2px;display:inline-block;flex:none}
.lx-leg em{font-style:normal;color:var(--color-fg-muted);font-variant-numeric:tabular-nums}
/* controles */
.lx-seg{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 var(--cds-gap-md)}
.lx-seg button{font:inherit;font-size:var(--cds-font-size-caption);color:var(--color-fg);background:transparent;border:1px solid var(--color-border-line);border-radius:999px;padding:.3rem .8rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.lx-seg button:hover{border-color:var(--color-fg-muted)}
.lx-seg button[aria-pressed=true]{background:var(--color-fg);color:var(--color-bg);border-color:var(--color-fg)}
.lx-seg button:focus-visible{outline:2px solid var(--color-fg);outline-offset:2px}
.lx-seg button i{width:.6rem;height:.6rem;border-radius:50%;display:inline-block}
/* mapa de calor */
.lx-heat{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,1fr));gap:2px;font-size:var(--cds-font-size-caption)}
.lx-heat>div{min-width:0}
.lx-hh{display:flex;align-items:flex-end;justify-content:center;gap:.25rem;padding:0 0 .3rem;font-weight:600;text-align:center;flex-wrap:wrap}
.lx-hh i{width:.55rem;height:.55rem;border-radius:50%;display:inline-block}
.lx-hg{grid-column:1/-1;padding:.7rem 0 .15rem;border-bottom:1px solid var(--color-border-line)}
.lx-hg b{font-weight:600;font-size:var(--cds-font-size-caption);text-transform:uppercase;letter-spacing:.04em}
.lx-hg span{color:var(--color-fg-muted);margin-left:.4rem}
.lx-hl{display:flex;align-items:center;padding:.15rem .4rem .15rem .5rem;overflow-wrap:anywhere}
.lx-hc{display:flex;align-items:center;justify-content:center;min-height:2rem;border-radius:3px;font-variant-numeric:tabular-nums;color:var(--color-fg-muted)}
.lx-hc.sig{color:var(--color-fg);font-weight:600}
.lx-scale{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;margin-top:var(--cds-gap-md);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.lx-scale i{display:inline-block;width:1.6rem;height:.8rem;border-radius:2px;vertical-align:middle;margin-right:.3rem}
/* bosque */
.lx-klegend{display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;margin:0 0 var(--cds-gap-sm);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.lx-klegend span{display:inline-flex;align-items:center;gap:.4rem}
/* cruces */
.lx-cross{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:var(--cds-gap-md)}
.lx-cp{border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-sm) var(--cds-pad-md);min-width:0}
.lx-cp h4{margin:0 0 .5rem;font-size:var(--cds-font-size-body);font-weight:600}
.lx-cr{display:grid;grid-template-columns:minmax(5.5rem,8.5rem) 1fr;gap:.6rem;align-items:center;padding:.18rem 0}
.lx-cl{font-size:var(--cds-font-size-caption);line-height:1.2}
.lx-cl small{display:block;color:var(--color-fg-muted)}
.lx-cs{display:flex;gap:2px;height:26px}
.lx-cs span{display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:.68rem;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.55);overflow:hidden}
.lx-warn{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.45rem}
.lx-warn li{max-width:80ch}
.lx-src{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
@media (max-width:520px){.lx-brow{grid-template-columns:6.5rem 1fr 3.6rem}.lx-cr{grid-template-columns:5rem 1fr}}

.lx-fun{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:var(--cds-gap-md)}
.lx-fc{border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-sm) var(--cds-pad-md);min-width:0}
.lx-fc h4{margin:0 0 .4rem;font-size:var(--cds-font-size-body);font-weight:600;display:flex;align-items:center;gap:.45rem}
.lx-fc h4 i{width:.7rem;height:.7rem;border-radius:50%;display:inline-block}
.lx-fc .lx-brow{grid-template-columns:minmax(6rem,9rem) 1fr 3.6rem}
.lx-hm{display:grid;grid-template-columns:minmax(6rem,1.4fr) repeat(4,minmax(0,1fr));gap:2px;font-size:var(--cds-font-size-caption)}
.lx-hm>div{min-width:0}
.lx-hmh{font-weight:600;text-align:center;padding:0 .2rem .3rem;display:flex;align-items:flex-end;justify-content:center}
.lx-hml{display:flex;align-items:center;padding:.15rem .4rem .15rem 0}
.lx-hmc{display:flex;align-items:center;justify-content:center;min-height:2.1rem;border-radius:3px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.lx-fc .lx-brow{grid-template-columns:5.5rem 1fr 3.2rem}}


.lx-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;margin-bottom:var(--cds-gap-sm)}
.lx-row .lx-seg{margin:0}
.lx-lab{min-width:6.5rem;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);font-weight:600}
.lx-muted{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.lx-filters{display:flex;flex-direction:column;gap:.5rem;flex:1 1 20rem;min-width:0}
.lx-filt{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.4rem .6rem;position:relative;padding-right:2rem}
.lx-filt b{font-size:var(--cds-font-size-caption)}
.lx-chips{display:flex;flex-wrap:wrap;gap:.3rem}
.lx-chips button{font:inherit;font-size:.78rem;color:var(--color-fg);background:transparent;border:1px solid var(--color-border-line);border-radius:999px;padding:.15rem .6rem;cursor:pointer}
.lx-chips button[aria-pressed=true]{background:var(--color-fg);color:var(--color-bg);border-color:var(--color-fg)}
.lx-chips button:focus-visible,.lx-x:focus-visible,.lx-btn:focus-visible,.lx-sel:focus-visible,.lx-tile:focus-visible{outline:2px solid var(--color-fg);outline-offset:2px}
.lx-x{position:absolute;right:.4rem;top:.35rem;font:inherit;border:0;background:transparent;color:var(--color-fg-muted);cursor:pointer;font-size:1.1rem;line-height:1}
.lx-sel{font:inherit;font-size:var(--cds-font-size-caption);color:var(--color-fg);background:var(--color-bg);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.35rem .5rem;max-width:100%}
.lx-btn{font:inherit;font-size:var(--cds-font-size-caption);color:var(--color-fg);background:transparent;border:1px solid var(--color-border-line);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.lx-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:var(--cds-gap-md)}
.lx-tile{font:inherit;text-align:left;color:var(--color-fg);background:transparent;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.6rem .8rem;cursor:pointer;display:flex;flex-direction:column;gap:.15rem}
.lx-tile[aria-pressed=true]{border-color:var(--color-fg);box-shadow:inset 0 0 0 1px var(--color-fg)}
.lx-tl{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.lx-tv{font-family:var(--font-anthropic-serif);font-size:2rem;line-height:1.1}
.lx-tc,.lx-td{font-size:.74rem;color:var(--color-fg-muted)}
.lx-ctls{display:flex;flex-wrap:wrap;gap:.6rem 1rem;margin:0 0 var(--cds-gap-md)}
.lx-fld{display:flex;flex-direction:column;gap:.2rem;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);min-width:0}
.lx-tb{border-collapse:collapse;width:100%;margin-top:var(--cds-gap-md);font-size:var(--cds-font-size-caption)}
.lx-tb th,.lx-tb td{text-align:left;padding:.25rem .5rem;border-bottom:1px solid var(--color-border-line)}
.lx-tb td.num,.lx-tb th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.lx-xt{display:grid;gap:2px;font-size:var(--cds-font-size-caption);overflow-x:auto}
.lx-xt>div{min-width:0}
.lx-xh{font-weight:600;text-align:center;padding:0 .2rem .3rem;display:flex;align-items:flex-end;justify-content:center}
.lx-xl{display:flex;align-items:center;padding:.15rem .4rem .15rem 0}
.lx-xc{display:flex;align-items:center;justify-content:center;min-height:2.1rem;border-radius:3px;font-variant-numeric:tabular-nums}
.lx-xt2{display:flex;align-items:center;justify-content:center;color:var(--color-fg-muted);font-size:.74rem}
.lx-fc h4 small{font-weight:400;color:var(--color-fg-muted);font-size:.74rem}
.lx-fc h4{flex-wrap:wrap}
.lx-fc{overflow:hidden}

.lx-gate{max-width:26rem;margin:12vh auto 0;font-family:var(--font-anthropic-sans);color:var(--color-fg)}
.lx-gcard{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);display:flex;flex-direction:column;gap:var(--cds-gap-md)}

.lx-gcard p{margin:0;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
.lx-grow{display:flex;gap:.5rem;flex-wrap:wrap}
.lx-grow input{flex:1 1 12rem;min-width:0;font:inherit;color:var(--color-fg);background:var(--color-bg);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:.5rem .7rem}
.lx-grow input:focus-visible,.lx-grow button:focus-visible{outline:2px solid var(--color-fg);outline-offset:2px}
.lx-grow button{font:inherit;cursor:pointer;color:var(--color-bg);background:var(--color-fg);border:1px solid var(--color-fg);border-radius:var(--cds-radius);padding:.5rem 1rem}
.lx-grow button:disabled{opacity:.5;cursor:default}
#lx-msg{min-height:1.2em;color:var(--color-fg-muted)}

function startApp(dash){

(function(){
  const f1=v=>d3.format('.1f')(v).replace('.',',');
  const f0=v=>d3.format('.0f')(v);
  const sg=v=>(v>0?'+':v<0?'−':'')+f1(Math.abs(v));
  const fi=n=>d3.format(',')(n).replace(/,/g,'.');
  const $=id=>document.getElementById(id);
  const wrap=$('lx-wrap'), tip=$('lx-tip');
  const MUTED='var(--cds-chart-muted)';
  const mix=(c,p)=>`color-mix(in srgb, ${c} ${p}%, transparent)`;
    function tipShow(ev,title,lines){
    tip.replaceChildren();
    const t=document.createElement('div');t.className='lx-tip-t';t.textContent=title;tip.append(t);
    lines.forEach(l=>{const d=document.createElement('div');d.textContent=l;tip.append(d);});
    tip.hidden=false;tipMove(ev);
  }
  function tipMove(ev){
    const r=wrap.getBoundingClientRect();const w=tip.offsetWidth;
    let x=ev.clientX-r.left+14,y=ev.clientY-r.top+16;
    if(x+w>r.width-4)x=Math.max(4,ev.clientX-r.left-w-14);
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  function tipHide(){tip.hidden=true;}
  function hover(sel,title,linesFn){

  const CANDS=[

  function load(){

  function buildMask(){

  function agg(ind,msk,by,k){

      const lt=svg.append('text').attr('x',0).attr('y',yc+4).attr('class','lx-st');wrapText(lt,r.cat,LW-12);
      svg.append('rect').attr('x',x(0)).attr('y',yc-12).attr('width',Math.max(1,x(r.pg)-x(0))).attr('height',11).attr('rx',2).attr('fill',c).attr('opacity',r.n<30?.4:1);
      svg.append('rect').attr('x',x(0)).attr('y',yc+1).attr('width',Math.max(1,x(r.pt)-x(0))).attr('height',11).attr('rx',2).attr('fill',MUTED);
      svg.append('text').attr('x',x(r.pg)+6).attr('y',yc-3).attr('class','lx-st').text(f1(r.pg)+' %');
      svg.append('text').attr('x',x(r.pt)+6).attr('y',yc+10).text(f1(r.pt)+' %');
      svg.append('rect').attr('x',0).attr('y',y).attr('width',W0).attr('height',RH).attr('fill','transparent')
        .on('mouseenter',()=>band.attr('opacity',.06)).on('mousemove',ev=>tipShow(ev,r.cat,[`Entre quienes cumplen: ${f1(r.pg)} % (${fi(r.n)} casos)`,`Toda la muestra filtrada: ${f1(r.pt)} %`,`Diferencia: ${sg(r.pg-r.pt)} pp`]))
        .on('mouseleave',()=>{band.attr('opacity',0);tipHide();});});
  }

  /* arranque */
  let started=false;
  function start(){
    $('lx-addvar').replaceChildren();
    const first=document.createElement('option');first.value='';first.textContent='Elegir variable…';$('lx-addvar').append(first);
    D.vars.forEach(v=>{});
    const groups=[...d3.group(D.vars,v=>v.group)];
    groups.forEach(([g,vs])=>{const og=document.createElement('optgroup');og.label=g;vs.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.label;og.append(o);});$('lx-addvar').append(og);});
    $('lx-addvar').addEventListener('change',e=>{const id=e.target.value;if(!id)return;if(!st.filters.some(f=>f.id===id))st.filters.push({id,sel:new Set()});e.target.value='';refreshFilters();});
    $('lx-clear').addEventListener('click',()=>{st.filters=[];refreshFilters();});
    $('lx-views').addEventListener('click',ev=>{const b=ev.target.closest('button[data-v]');if(!b)return;st.view=b.dataset.v;syncViews();drawXctl();drawOut();});
    buildMeasures();buildMask();drawCands();drawFilters();drawCount();drawTiles();drawXctl();drawOut();started=true;
  }
  dash.onData(()=>{if(!load())return;if(!started)start();else drawOut();});
})();

}

(function(){
  const gate=document.getElementById('lx-gate'),app=document.getElementById('lx-app');
  const pw=document.getElementById('lx-pw'),btn=document.getElementById('lx-go'),msg=document.getElementById('lx-msg');
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  let payload=null,busy=false,unlocked=false;
  dash.onData(()=>{
    if(unlocked)return;
    const d=dash.data('cifrado');
    if(d.status==='ok'&&d.data&&d.data[0]){payload=d.data[0];if(!busy){btn.disabled=false;if(msg.textContent==='Cargando…')msg.textContent='';}}
    else{btn.disabled=true;msg.textContent=d.status==='loading'?'Cargando…':'No se pudo cargar el contenido.';}
  });
  function launch(bundle){
    unlocked=true;gate.hidden=true;app.hidden=false;
    app.innerHTML=bundle.html;
    const fns=[];
    const shim={colors:dash.colors,
      data:id=>bundle.data[id]?{status:'ok',data:bundle.data[id]}:{status:'missing',data:[]},
      onData:fn=>{fns.push(fn);fn();}};
    let w=app.clientWidth;
    new ResizeObserver(()=>{if(app.clientWidth!==w){w=app.clientWidth;requestAnimationFrame(()=>fns.forEach(f=>f()));}}).observe(app);
    startApp(shim);
  }
  async function unlock(){
    if(busy||!payload)return;
    if(!(window.crypto&&crypto.subtle)){msg.textContent='Este navegador no permite descifrar la página.';return;}
    busy=true;btn.disabled=true;msg.textContent='Verificando…';
    let bundle;
    try{
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.ct));
      bundle=JSON.parse(new TextDecoder().decode(buf));
    }catch(e){busy=false;btn.disabled=false;msg.textContent='Clave incorrecta.';pw.select();return;}
    try{launch(bundle);}catch(e){msg.textContent='La página descifró bien, pero no pudo dibujarse.';console.error(e);}
  }
  btn.addEventListener('click',unlock);
  pw.addEventListener('keydown',ev=>{if(ev.key==='Enter')unlock();});
  btn.disabled=true;
})();

</script>
